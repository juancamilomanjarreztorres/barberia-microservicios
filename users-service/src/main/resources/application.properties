# Nombre del microservicio
spring.application.name=users-service

# Puerto del microservicio
server.port=${PORT:8081}

# Configuracion de MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_barberia?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=TRACE

# Configuracion JWT exclusiva para pruebas
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Configuracion de correo SMTP - Brevo

spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:bf5bea001@smtp-brevo.com}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Correo remitente
app.mail.from=${MAIL_FROM:manjarreztorresjuancamilo48@gmail.com}
