# Nombre del microservicio
spring.application.name=appointments-service

# Puerto
server.port=${PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_barberia?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Zona horaria
spring.jackson.time-zone=America/Bogota

# Almacenamiento de imágenes de servicios
app.upload.dir=${APP_UPLOAD_DIR:${user.dir}/uploads/servicios}